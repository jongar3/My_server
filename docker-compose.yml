services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    # Sustituye 1000:1000 por tu UID:GID si es necesario
    user: 1000:1000
    ports:
      - 8096:8096
      - 7359:7359/udp
    volumes:
      # Formato: [Ruta en máquina] : [Ruta dentro del contenedor]
      - ./jellyfin/jellyfin-config:/config
      - ./jellyfin/jellyfin-cache:/cache
      - /mnt/mi_cuevana:/media:ro

    devices: # Configuracion de dispositivos para aceleracion por hardware en Raspberry Pi
      - /dev/dri:/dev/dri # Renderizado de video (V3D)
      - /dev/vchiq:/dev/vchiq # Acceso a los componentes de hardware de Broadcom
      - /dev/video10:/dev/video10 # Decodificador H.264
      - /dev/video11:/dev/video11 # Decodificador HEVC/H.265
      - /dev/video12:/dev/video12 # Codificador

    restart: 'unless-stopped'
    environment:
      - JELLYFIN_PublishedServerUrl=https://jelly.jgc-server.duckdns.org  # Ip de la maquina host

  immich-server:
      container_name: immich_server
      image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
      # extends:
      #   file: hwaccel.transcoding.yml
      #   service: cpu # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
      volumes:
        # Do not edit the next line. If you want to change the media storage location on your system, edit the value of UPLOAD_LOCATION in the .env file
        - ${UPLOAD_LOCATION}:/data
        - /etc/localtime:/etc/localtime:ro
      env_file:
        - .env
      ports:
        - '2283:2283'
      depends_on:
        - redis
        - database
      restart: always
      healthcheck:
        disable: false
    #FOR MACHINE LEARNING 
    #TODO: BUY A BETTER HOMELAB AND START FIGHTING WITH NVIDIA DRIVERS :)
    # immich-machine-learning:
    #   container_name: immich_machine_learning
    #   # For hardware acceleration, add one of -[armnn, cuda, rocm, openvino, rknn] to the image tag.
    #   # Example tag: ${IMMICH_VERSION:-release}-cuda
    #   image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    #   # extends: # uncomment this section for hardware acceleration - see https://docs.immich.app/features/ml-hardware-acceleration
    #   #   file: hwaccel.ml.yml
    #   #   service: cpu # set to one of [armnn, cuda, rocm, openvino, openvino-wsl, rknn] for accelerated inference - use the `-wsl` version for WSL2 where applicable
    #   volumes:
    #     - model-cache:/cache
    #   env_file:
    #     - .env
    #   restart: always
    #   healthcheck:
    #     disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:3b55fbaa0cd93cf0d9d961f405e4dfcc70efe325e2d84da207a0a8e6d8fde4f9
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    env_file:
      - .env
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # Uncomment the DB_STORAGE_TYPE: 'HDD' var if your database isn't stored on SSDs
      DB_STORAGE_TYPE: 'HDD'
    volumes:
      # Do not edit the next line. If you want to change the database storage location on your system, edit the value of DB_DATA_LOCATION in the .env file
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false

volumes:
  caddy_data:
  caddy_config:
  model-cache:
